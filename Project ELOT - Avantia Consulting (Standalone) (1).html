    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const loading = document.getElementById("__bundler_loading");
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        const FONT_MIME =
          /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
        const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
        function toBase64(bytes) {
          let bin = "";
          for (let i = 0; i < bytes.length; i += 0x8000) {
            bin += String.fromCharCode.apply(
              null,
              bytes.subarray(i, i + 0x8000),
            );
          }
          return btoa(bin);
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          "error",
          function (e) {
            // Failed resource loads (CSP-blocked links, scripts, images) fire plain
            // events at the element — warn only; real JS errors carry message/error.
            if (!e.message && !e.error && e.target && e.target !== window) {
              console.warn(
                "[bundle] resource failed to load:",
                e.target.tagName,
                String(e.target.src || e.target.href || ""),
              );
              return;
            }
            var p = document.body || document.documentElement;
            var d =
              document.getElementById("__bundler_err") ||
              p.appendChild(document.createElement("div"));
            d.id = "__bundler_err";
            d.style.cssText =
              "position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto";
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : "") +
              "[bundle] " +
              (e.message || e.type) +
              (e.filename
                ? " (" + e.filename.slice(0, 60) + ":" + e.lineno + ")"
                : "");
          },
          true,
        );

        try {
          const manifestEl = document.querySelector(
            'script[type="__bundler/manifest"]',
          );
          const templateEl = document.querySelector(
            'script[type="__bundler/template"]',
          );
          if (!manifestEl || !templateEl) {
            setStatus("Error: missing bundle data");
            console.error(
              "[bundler] Missing script tags — manifestEl:",
              !!manifestEl,
              "templateEl:",
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
          // document's manifest; frame srcs carry an about:blank#<uuid> marker
          // instead of a substitutable uuid. Every document mints the blobs for
          // its OWN frames — from local text at the root, or text obtained from
          // its DIRECT parent over the relay protocol below — so each frame
          // navigation stays same-origin with its initiator and a deduped page
          // loads at any depth on any host, including a file:// download's
          // opaque origins (where a blob minted by one document cannot be
          // navigated to by another).
          const pageOrderEl = document.querySelector(
            'script[type="__bundler/page_order"]',
          );
          const pageOrder = pageOrderEl
            ? JSON.parse(pageOrderEl.textContent)
            : [];
          const pageSet = new Set(pageOrder);
          const pageTexts = {};

          // ── Nested-page text protocol (parent-chain relay) ──
          // Page bundles ship once, in the ROOT document's manifest. Every
          // document mints the blobs for its OWN frames, obtaining page text
          // through a strict parent-chain relay: a document only ever SENDS to
          // its direct parent (which, for every document the publisher's own
          // runtime minted, is another publisher document) and only ACCEPTS
          // text from that direct parent; requests from below are honored only
          // for the document's own child frames, and the ROOT never sends
          // upward at all. That last rule is load-bearing: the artifact host's
          // frame-ancestors allows claude.ai (and friends) to frame an
          // artifact, so window.top can be a FOREIGN document — a top-addressed
          // protocol would hand page uuids to that ancestor and accept forged
          // "page text" from it, minting attacker HTML as an artifact-origin
          // blob document. The chain never touches the ancestor: requests stop
          // at the root, replies are origin-addressed per hop (never '*' when
          // an origin exists), and both directions are origin-gated (on https
          // a foreign sender's origin can never equal this document's; in
          // opaque contexts — file:// — everything serializes as 'null', where
          // an embedded EXTERNAL frame still fails the gate by carrying its
          // own real origin, and a sandboxed child of such a frame is excluded
          // by the own-child-frames check plus uuid unguessability). Shape is
          // deny-by-default: one request form, one reply form, no error
          // replies.
          // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
          // contexts such as a sandboxed preview iframe) — location.origin is
          // computed from the URL and stays 'https://…' even when the document
          // is sandboxed, which would misgate every opaque chain.
          const OWN_TARGET = /^https?:[/][/]/.test(window.origin || "")
            ? window.origin
            : "*";
          function trustedOrigin(e) {
            if (e.origin === window.origin) return true; // https chains; opaque==opaque
            // file:// trees: Chrome serializes the file document's origin as
            // 'file://' while the blob: documents it mints serialize as 'null',
            // so the two legitimate shapes can never string-match — accept the
            // pair in both directions. https origins never serialize as either,
            // and sender identity (own child frame / direct parent) is checked
            // separately.
            return (
              (e.origin === "null" &&
                (window.origin === "file://" ||
                  window.location.protocol === "file:")) ||
              (/^file:/.test(e.origin) && window.origin === "null")
            );
          }
          // Non-empty only in the root document (nested bundles ship an empty
          // island), so it doubles as the root marker: the root answers from
          // local text and treats a miss as authoritative — never relaying to
          // its (possibly foreign) parent.
          const isPageRoot = pageOrder.length > 0;
          const blobUrls = {};
          const resourceBlobs = {};
          const UUID_SHAPE =
            /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
          const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
          const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
          function mountPage(el, frag, text) {
            const pageBlob = new Blob([text], { type: "text/html" });
            const u = URL.createObjectURL(pageBlob);
            resourceBlobs[u] = pageBlob;
            el.src = u + frag;
          }
          function deliverPage(uuid, text) {
            const frames = pendingFrames[uuid];
            delete pendingFrames[uuid];
            if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
            const relays = pendingRelays[uuid];
            delete pendingRelays[uuid];
            if (relays) {
              for (const cw of relays) {
                try {
                  cw.postMessage(
                    { __bundler_page: uuid, __bundler_text: text },
                    OWN_TARGET,
                  );
                } catch (err) {
                  /* gone */
                }
              }
            }
          }
          function ownFrameWindows() {
            const out = [];
            for (const f of Array.from(document.querySelectorAll("iframe"))) {
              try {
                if (f.contentWindow) out.push(f.contentWindow);
              } catch (err) {
                /* detached */
              }
            }
            return out;
          }
          window.addEventListener("message", function (e) {
            const d = e.data;
            if (!d || typeof d !== "object" || !e.source) return;
            // Origin gate first; the structural checks below (own-child-frames
            // for requests, direct-parent + solicited-uuid for replies, the
            // root's never-relay rule) are what hold in fully opaque chains
            // where origin strings can't discriminate — a sandboxed root's
            // FOREIGN wrapper still fails all three even though both serialize
            // as real-vs-'null' rather than matching.
            if (!trustedOrigin(e)) return;
            if (
              typeof d.__bundler_need === "string" &&
              UUID_SHAPE.test(d.__bundler_need)
            ) {
              // Requests are honored only for this document's own child frames.
              if (ownFrameWindows().indexOf(e.source) < 0) return;
              const uuid = d.__bundler_need;
              const text = pageTexts[uuid];
              if (typeof text === "string") {
                try {
                  e.source.postMessage(
                    { __bundler_page: uuid, __bundler_text: text },
                    OWN_TARGET,
                  );
                } catch (err) {
                  /* gone */
                }
                return;
              }
              if (isPageRoot || window.parent === window) return; // authoritative miss
              const waiting = pendingRelays[uuid];
              if (waiting) {
                if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
                return;
              }
              // Never-answered uuids would otherwise accumulate forever under a
              // request spray; past the cap (far above any real page count) new
              // relays are dropped rather than remembered.
              if (Object.keys(pendingRelays).length >= 128) return;
              pendingRelays[uuid] = [e.source];
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            } else if (
              typeof d.__bundler_page === "string" &&
              UUID_SHAPE.test(d.__bundler_page) &&
              typeof d.__bundler_text === "string"
            ) {
              // The shape test is load-bearing beyond tidiness: the solicited
              // check below uses the in operator, which matches prototype keys
              // ('__proto__', 'constructor') — an unshaped key would reach
              // deliverPage and throw, painting the error banner.
              // Text is accepted only from the direct parent — the document
              // that minted this one.
              if (e.source !== window.parent || window.parent === window)
                return;
              if (
                !(d.__bundler_page in pendingFrames) &&
                !(d.__bundler_page in pendingRelays)
              )
                return;
              deliverPage(d.__bundler_page, d.__bundler_text);
            }
          });

          const uuids = Object.keys(manifest);
          setStatus("Unpacking " + uuids.length + " assets...");

          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++)
                  bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== "undefined") {
                    const ds = new DecompressionStream("gzip");
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      "DecompressionStream not available, asset " +
                        uuid +
                        " may not render",
                    );
                  }
                }

                if (pageSet.has(uuid)) {
                  pageTexts[uuid] = new TextDecoder().decode(finalBytes);
                  return;
                }
                if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
                  // Strict artifact hosts allow font-src data: but not blob:.
                  blobUrls[uuid] =
                    "data:" +
                    entry.mime +
                    ";base64," +
                    (entry.compressed ? toBase64(finalBytes) : entry.data);
                } else {
                  const blob = new Blob([finalBytes], { type: entry.mime });
                  blobUrls[uuid] = URL.createObjectURL(blob);
                  resourceBlobs[blobUrls[uuid]] = blob;
                }
              } catch (err) {
                console.error("Failed to decode asset " + uuid + ":", err);
                const blob = new Blob([], { type: entry.mime });
                blobUrls[uuid] = URL.createObjectURL(blob);
                resourceBlobs[blobUrls[uuid]] = blob;
              }
            }),
          );

          const extResEl = document.querySelector(
            'script[type="__bundler/ext_resources"]',
          );
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid])
              resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
          // consumers read these Blobs directly. Survives the swap like the error sink.
          window.__resourceBlobs = resourceBlobs;

          setStatus("Rendering...");
          // Page uuids have no blob here — they ride inside about:blank#<uuid>
          // frame markers the pass below resolves after the swap.
          for (const uuid of uuids) {
            if (pageSet.has(uuid)) continue;
            template = template.split(uuid).join(blobUrls[uuid]);
          }

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template
            .replace(/\s+integrity="[^"]*"/gi, "")
            .replace(/\s+crossorigin="[^"]*"/gi, "");

          const resourceScript =
            "<script>window.__resources = " +
            JSON.stringify(resourceMap).replace(/<\//g, "<\\/") +
            ";</" +
            "script>";
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template =
              template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, "text/html");
          document.documentElement.replaceWith(doc.documentElement);

          // Resolve page-frame markers: mint this document's own blob for each
          // framed page — from local text when this is the root, otherwise by
          // asking the direct parent over the relay protocol above. An
          // unanswered request leaves the frame on about:blank, the same
          // degraded state as a refused embed.
          {
            const MARKER =
              /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
            const needed = [];
            for (const el of Array.from(document.querySelectorAll("iframe"))) {
              const m = MARKER.exec(el.getAttribute("src") || "");
              if (!m) continue;
              const text = pageTexts[m[1]];
              if (typeof text === "string") {
                mountPage(el, m[2] || "", text);
              } else if (window.parent !== window && !isPageRoot) {
                const had = pendingFrames[m[1]];
                (pendingFrames[m[1]] = had || []).push({
                  el: el,
                  frag: m[2] || "",
                });
                if (!had) needed.push(m[1]);
              }
            }
            for (const uuid of needed) {
              window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
            }
          }

          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement("script");
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: read and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === "text/babel" || s.type === "text/jsx") && s.src) {
              const pre = resourceBlobs[s.src.split("#")[0]];
              s.textContent = pre
                ? await pre.text()
                : await (await fetch(s.src)).text();
              s.removeAttribute("src");
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (
            window.Babel &&
            typeof window.Babel.transformScriptTags === "function"
          ) {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus("Error unpacking: " + err.message);
          console.error("Bundle unpack error:", err);
        }
      });
    </script>

-spacing:0.16em;\n    color:#5a8a8a; border-top:1px solid rgba(232,128,74,0.2); padding-top:18px;\n  }\n  .modal-footer {\n    padding:18px 30px; border-top:1px solid rgba(232,128,74,0.3); text-align:right;\n  }\n  #modal-close {\n    padding:11px 22px; background:transparent; border:1px solid rgba(232,128,74,0.5);\n    color:#ff9a5c; cursor:pointer; font-family:'Inter',sans-serif; font-size:11px;\n    font-weight:500; letter-spacing:0.2em; text-transform:uppercase;\n    transition:background 0.25s, color 0.25s;\n  }\n  #modal-close:hover { background:#e8804a; color:#0a0a0f; }\n  .modal-body::-webkit-scrollbar { width:6px; }\n  .modal-body::-webkit-scrollbar-thumb { background:rgba(232,128,74,0.4); }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div id=\"canvas-container\"><\u002Fdiv>\n\n<div id=\"hud-intro\">\n  <div id=\"intro-title\">AVANTIA CONSULTING<\u002Fdiv>\n  <div id=\"intro-subtitle\">AI Consulting Division · Project ELOT<\u002Fdiv>\n<\u002Fdiv>\n<div id=\"intro-loading\">BUILDING SCENE<\u002Fdiv>\n\n<div id=\"flash\"><\u002Fdiv>\n\n<div id=\"hud-corridor-label\">\n  <div class=\"label-name\"><\u002Fdiv>\n  <div class=\"label-subtitle\"><\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"hud-main\" class=\"hidden\">\n  <div class=\"hud-corner tl\">\n    <div class=\"logo-mark\">AVANTIA CONSULTING<\u002Fdiv>\n    <div class=\"dept\">AI Division<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hud-corner tr\">\n    <div class=\"engagement-label\">Project ELOT<\u002Fdiv>\n    <div class=\"engagement-client\">Suvidha Finserve<\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hud-bottom\">\n    <input type=\"text\" id=\"brief-input\" placeholder=\"Brief the agent...\" value=\"Diagnose SME loan origination TAT at Suvidha Finserve\">\n    <button id=\"run-agent\">Run Agent<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"hud-bottom-right\">\n    <button id=\"replay\">↺ Replay intro<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"hud-summary\">\n  <div class=\"summary-stats\">\n    <div class=\"stat-block\"><div class=\"stat-value\">47<\u002Fdiv><div class=\"stat-label\">Findings<\u002Fdiv><\u002Fdiv>\n    <div class=\"stat-block\"><div class=\"stat-value\">5<\u002Fdiv><div class=\"stat-label\">Frameworks<\u002Fdiv><\u002Fdiv>\n    <div class=\"stat-block\"><div class=\"stat-value\">≤3d<\u002Fdiv><div class=\"stat-label\">Target TAT<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"summary-headline\">SME origination runs at 12 working days against a 24-hour benchmark. The recommendation is a control layer around the legacy LOS — not a replacement programme.<\u002Fdiv>\n  <button id=\"view-output\">View full output<\u002Fbutton>\n<\u002Fdiv>\n\n<div id=\"modal-output\" class=\"hidden\">\n  <div class=\"modal-card\">\n    <div class=\"modal-header\">Project ELOT · Agent Output<\u002Fdiv>\n    <div class=\"modal-body\">\n      <p><strong>Diagnostic summary.<\u002Fstrong>Suvidha's SME loan origination process currently averages 12 working days end-to-end against a competitive benchmark of 24 hours. Analysis across 210 branches indicates the delay is not a single failure but the compound effect of five reinforcing pressures: customer expectations that have moved to same-day decisioning, an origination process built for a smaller book, credit rules interpreted inconsistently at the branch level, a legacy Loan Origination System that cannot exchange data cleanly with co-lending partners, and a governance model that still depends on paper and email evidence.<\u002Fp>\n      <p><strong>Recommendation.<\u002Fstrong>Do not attempt a like-for-like replacement of the legacy LOS. The 2021 Saarthi programme failed at ₹4.1cr because it was IT-led, imposed mandatory fields that did not fit branch reality, and lost frontline adoption within weeks. Instead, build a control layer around the legacy core: an enforced workflow, centrally-owned credit rules, digital document capture with e-KYC, API-based partner reconciliation, and an event-level audit trail. The legacy LOS is retained, rationalised, and only retired once the new layer has evidence of stability.<\u002Fp>\n      <p><strong>Change readiness.<\u002Fstrong>Applying ADKAR at role level: relationship managers score high on Awareness but low on Ability without pilot support. Credit approvers score moderately on Desire but resist without governed exception paths. Regional heads sit in the manage-closely quadrant. A Kotter-style guiding coalition co-designed with credit, ops, and branch leadership is required before any configuration begins.<\u002Fp>\n      <p><strong>Delivery.<\u002Fstrong>Stage gates for control, Scrum inside each gate for learning. 28-day diagnostic, then future-state design, MVP build, single-region pilot with hard evidence gates on TAT, consistency, controls, and adoption before scaling. Target: SME TAT reduced from 12 days to ≤3 days within 12 months of full rollout.<\u002Fp>\n      <p class=\"meta\">Findings: 47 · Frameworks applied: 5 · Ready for consultant review.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"modal-footer\"><button id=\"modal-close\">Close<\u002Fbutton><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"skip-intro\">Skip intro<\u002Fdiv>\n\n<script src=\"3a2ef334-32cd-47e0-a18a-d0abf3f311ed\"><\u002Fscript>\n<script>\n/* ===================================================================\n   PROJECT ELOT — Cinematic 3D Consulting Experience\n   Single file. Three.js r128. All geometry procedural, all data mocked.\n   Backend swap points are marked with: TODO: replace with fetch\n   =================================================================== */\n\n/* === CONSTANTS === */\nconst COLORS = {\n  bgDeep: 0x0a0a0f,\n  structureDark: 0x1a1a22,\n  structureMid: 0x2a2a35,\n  amber: 0xe8804a,\n  amberBright: 0xff9a5c,\n  warmWhite: 0xf4ede4,\n  teal: 0x5a8a8a,\n  purpleDeep: 0x1a0f2e,\n  windowLit: 0xffb070\n};\n\nconst HEX = {\n  amber: '#e8804a',\n  amberBright: '#ff9a5c',\n  warmWhite: '#f4ede4',\n  teal: '#5a8a8a',\n  bg: '#0a0a0f',\n  dim: 'rgba(244,237,228,0.45)'\n};\n\nconst FONTS = {\n  serif: '\"Fraunces\", serif',\n  sans: '\"Inter\", sans-serif',\n  mono: '\"JetBrains Mono\", monospace'\n};\n\nconst TIMING = {\n  act1_titleFadeIn: 0.8,\n  act1_titleHold: 1.5,\n  act1_titleFadeOut: 0.7,\n  act1_total: 3.0,\n  act2_cityReveal: 6.0,\n  act3_buildingApproach: 4.0,\n  act3_doorsOpen: 1.0,\n  act3_entryFlash: 0.5,\n  act4_corridorTraverse: 7.0,\n  act5_arrival: 3.0,\n  intro_total: 25.0\n};\n\nconst ROOM_CENTER_Z = -82;\n\n/* === MODULE STATE === */\nlet scene, camera, renderer, clock;\nlet state = 'INTRO';\nlet doorL, doorR, doorOpenStart = null;\nlet doorsOpened = false, flashTriggered = false;\nlet frameworkPanels = [];\nlet agentScreens = [];\nlet agentForm, particles;\nlet orbitStartTime = 0;\nlet labelTimer = null;\nlet agentRunning = false;\nlet introFadeDone = false;\n\n/* === SMALL UTILS === */\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\nfunction easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }\nfunction makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }\n\n/* ===================================================================\n   CANVAS TEXTURE FACTORY\n   Every texture is drawn once at init and cached. Nothing redraws per frame.\n   =================================================================== */\n\nfunction wrapText(ctx, text, x, y, maxWidth, lineHeight) {\n  const words = String(text).split(' ');\n  let line = '', ly = y;\n  for (const w of words) {\n    const test = line ? line + ' ' + w : w;\n    if (ctx.measureText(test).width > maxWidth && line) { ctx.fillText(line, x, ly); line = w; ly += lineHeight; }\n    else line = test;\n  }\n  if (line) ctx.fillText(line, x, ly);\n  return ly;\n}\n\nfunction arrowDown(ctx, x, yTop, yBot) {\n  ctx.beginPath(); ctx.moveTo(x, yTop); ctx.lineTo(x, yBot); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(x - 7, yBot - 10); ctx.lineTo(x, yBot); ctx.lineTo(x + 7, yBot - 10); ctx.stroke();\n}\nfunction arrowRight(ctx, xL, xR, y) {\n  ctx.beginPath(); ctx.moveTo(xL, y); ctx.lineTo(xR, y); ctx.stroke();\n  ctx.beginPath(); ctx.moveTo(xR - 10, y - 6); ctx.lineTo(xR, y); ctx.lineTo(xR - 10, y + 6); ctx.stroke();\n}\nfunction hexagon(ctx, cx, cy, r) {\n  ctx.beginPath();\n  for (let i = 0; i < 6; i++) {\n    const a = (i / 6) * Math.PI * 2;\n    const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;\n    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);\n  }\n  ctx.closePath(); ctx.stroke();\n}\n\nconst FRAMEWORK_PANELS = [\n  { name: 'E5 FRAMEWORK',      subtitle: 'Discovery',      schematic: 'e5' },\n  { name: 'QUESTION MIX',      subtitle: 'Elicitation',    schematic: 'questions' },\n  { name: 'McKINSEY 7S',       subtitle: 'Diagnosis',      schematic: '7s' },\n  { name: 'MECE / LOGIC TREE', subtitle: 'Structuring',    schematic: 'tree' },\n  { name: 'BR → UR → FR',      subtitle: 'Requirements',   schematic: 'reqs' },\n  { name: 'ZACHMAN GRID',      subtitle: 'Architecture',   schematic: 'grid' },\n  { name: 'DMADV',             subtitle: 'Process Design', schematic: 'dmadv' },\n  { name: 'ADKAR + KOTTER',    subtitle: 'Change',         schematic: 'change' }\n];\n\nfunction createPanelCanvas(fw) {\n  const canvas = makeCanvas(1024, 640);\n  const ctx = canvas.getContext('2d');\n\n  ctx.fillStyle = HEX.bg; ctx.fillRect(0, 0, 1024, 640);\n  ctx.strokeStyle = HEX.amber; ctx.lineWidth = 3; ctx.strokeRect(20, 20, 984, 600);\n\n  ctx.fillStyle = HEX.warmWhite;\n  ctx.font = 'bold 72px ' + FONTS.serif;\n  ctx.textAlign = 'center'; ctx.textBaseline = 'top';\n  ctx.fillText(fw.name, 512, 80);\n\n  ctx.fillStyle = HEX.teal;\n  ctx.font = '500 28px ' + FONTS.sans;\n  ctx.fillText(fw.subtitle, 512, 175);\n\n  drawSchematic(ctx, fw.schematic);\n  return canvas;\n}\n\nfunction drawSchematic(ctx, type) {\n  ctx.strokeStyle = HEX.amber;\n  ctx.fillStyle = HEX.warmWhite;\n  ctx.lineWidth = 2;\n  ctx.textAlign = 'center';\n  ctx.textBaseline = 'middle';\n\n  switch (type) {\n\n    case 'e5': {\n      const labels = ['EXPAND','EXAMINE','EMPATHIZE','ELEVATE','ENVISION'];\n      const boxW = 160, boxH = 160, startX = 32, y = 300;\n      labels.forEach((label, i) => {\n        const x = startX + i * 192;\n        ctx.strokeRect(x, y, boxW, boxH);\n        ctx.font = '500 22px ' + FONTS.sans;\n        ctx.fillStyle = HEX.warmWhite;\n        ctx.fillText(label, x + boxW/2, y + boxH/2);\n      });\n      break;\n    }\n\n    case 'questions': {\n      const labels = ['INVESTIGATIVE','SUCCESSIVE','SPECULATIVE','PRODUCTIVE','INTERPRETIVE','SUBJECTIVE'];\n      const r = 55;\n      labels.forEach((label, i) => {\n        const col = i % 3, row = Math.floor(i / 3);\n        const cx = 236 + col * 276, cy = 300 + row * 150;\n        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();\n        ctx.font = '400 16px ' + FONTS.sans;\n        ctx.fillStyle = HEX.warmWhite;\n        wrapText(ctx, label, cx, cy, 96, 18);\n      });\n      break;\n    }\n\n    case '7s': {\n      const cx = 512, cy = 420, hubR = 45, orbitR = 150, nodeR = 35;\n      const labels = ['STRATEGY','STRUCTURE','SYSTEMS','SKILLS','STYLE','STAFF','SHARED VALUES'];\n      // spokes first so nodes draw over them\n      labels.forEach((_, i) => {\n        const a = (i / 7) * Math.PI * 2 - Math.PI / 2;\n        ctx.strokeStyle = 'rgba(232,128,74,0.5)'; ctx.lineWidth = 1;\n        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * orbitR, cy + Math.sin(a) * orbitR); ctx.stroke();\n      });\n      ctx.lineWidth = 2; ctx.strokeStyle = HEX.amber;\n      labels.forEach((label, i) => {\n        const a = (i / 7) * Math.PI * 2 - Math.PI / 2;\n        const nx = cx + Math.cos(a) * orbitR, ny = cy + Math.sin(a) * orbitR;\n        ctx.fillStyle = HEX.bg;\n        ctx.beginPath(); ctx.arc(nx, ny, nodeR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();\n        ctx.fillStyle = HEX.warmWhite;\n        ctx.font = '400 13px ' + FONTS.sans;\n        wrapText(ctx, label, nx, ny, 62, 14);\n      });\n      ctx.fillStyle = HEX.amber;\n      ctx.beginPath(); ctx.arc(cx, cy, hubR, 0, Math.PI * 2); ctx.fill();\n      ctx.fillStyle = HEX.bg; ctx.font = 'bold 30px ' + FONTS.serif;\n      ctx.fillText('7S', cx, cy + 1);\n      break;\n    }\n\n    case 'tree': {\n      const box = (x, y, w, h, label, fs) => {\n        ctx.strokeStyle = HEX.amber; ctx.lineWidth = 2;\n        ctx.strokeRect(x, y, w, h);\n        ctx.fillStyle = HEX.warmWhite; ctx.font = '500 ' + fs + 'px ' + FONTS.sans;\n        ctx.fillText(label, x + w/2, y + h/2);\n      };\n      const link = (x1, y1, x2, y2) => {\n        ctx.strokeStyle = 'rgba(232,128,74,0.6)'; ctx.lineWidth = 1;\n        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1, (y1 + y2) / 2);\n        ctx.lineTo(x2, (y1 + y2) / 2); ctx.lineTo(x2, y2); ctx.stroke();\n      };\n      box(422, 250, 180, 48, 'PROBLEM', 20);\n      const branchX = [172, 462, 752];\n      branchX.forEach(bx => {\n        link(512, 298, bx + 75, 350);\n        box(bx, 350, 150, 44, 'DRIVER', 17);\n      });\n      branchX.forEach((bx, i) => {\n        [0, 1].forEach(j => {\n          const lx = bx - 18 + j * 108;\n          link(bx + 75, 394, lx + 45, 460);\n          box(lx, 460, 90, 40, 'L' + (i * 2 + j + 1), 15);\n        });\n      });\n      break;\n    }\n\n    case 'reqs': {\n      const bars = [\n        { label: 'BUSINESS REQUIREMENT', w: 700 },\n        { label: 'USER REQUIREMENT',     w: 560 },\n        { label: 'FUNCTIONAL REQUIREMENT', w: 420 }\n      ];\n      let y = 262;\n      bars.forEach((b, i) => {\n        const x = 512 - b.w / 2;\n        ctx.strokeStyle = HEX.amber; ctx.lineWidth = 2;\n        ctx.strokeRect(x, y, b.w, 66);\n        ctx.fillStyle = HEX.warmWhite; ctx.font = '500 24px ' + FONTS.sans;\n        ctx.fillText(b.label, 512, y + 33);\n        if (i < bars.length - 1) arrowDown(ctx, 512, y + 66, y + 108);\n        y += 108;\n      });\n      break;\n    }\n\n    case 'grid': {\n      const cols = ['WHAT','HOW','WHERE','WHO','WHEN','WHY'];\n      const rows = ['STRATEGIST','EXECUTIVE','ARCHITECT','ENGINEER','TECHNOLOGIST','WORKER'];\n      const cell = 50, gx = 400, gy = 280;\n      ctx.font = '400 14px ' + FONTS.mono; ctx.fillStyle = HEX.teal;\n      cols.forEach((c, i) => ctx.fillText(c, gx + i * cell + cell / 2, gy - 16));\n      ctx.textAlign = 'right'; ctx.font = '400 12px ' + FONTS.mono;\n      rows.forEach((r, i) => ctx.fillText(r, gx - 14, gy + i * cell + cell / 2));\n      ctx.textAlign = 'center';\n      // deterministic fill pattern so the \"populated\" cells never flicker between builds\n      const filled = [0,3,4,7,9,11,12,15,16,20,22,25,27,28,31,33];\n      for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) {\n        const x = gx + c * cell, y = gy + r * cell, idx = r * 6 + c;\n        if (filled.indexOf(idx) !== -1) { ctx.fillStyle = 'rgba(232,128,74,0.75)'; ctx.fillRect(x + 2, y + 2, cell - 4, cell - 4); }\n        ctx.strokeStyle = 'rgba(232,128,74,0.7)'; ctx.lineWidth = 1;\n        ctx.strokeRect(x, y, cell, cell);\n      }\n      break;\n    }\n\n    case 'dmadv': {\n      const labels = ['DEFINE','MEASURE','ANALYZE','DESIGN','VERIFY'];\n      const r = 76, y = 400;\n      labels.forEach((label, i) => {\n        const cx = 116 + i * 195;\n        ctx.strokeStyle = HEX.amber; ctx.lineWidth = 2;\n        hexagon(ctx, cx, y, r);\n        ctx.fillStyle = HEX.warmWhite; ctx.font = '500 19px ' + FONTS.sans;\n        ctx.fillText(label, cx, y);\n        if (i < labels.length - 1) arrowRight(ctx, cx + r + 4, cx + 195 - r - 4, y);\n      });\n      break;\n    }\n\n    case 'change': {\n      const adkar = ['A','D','K','A','R'];\n      const bw = 152, bh = 92, bx = 132, by = 268;\n      adkar.forEach((l, i) => {\n        ctx.strokeStyle = HEX.amber; ctx.lineWidth = 2;\n        ctx.strokeRect(bx + i * bw, by, bw, bh);\n        ctx.fillStyle = HEX.warmWhite; ctx.font = 'bold 40px ' + FONTS.serif;\n        ctx.fillText(l, bx + i * bw + bw / 2, by + bh / 2);\n      });\n      ctx.fillStyle = HEX.teal; ctx.font = '400 15px ' + FONTS.mono;\n      ctx.fillText('KOTTER · 8 STEPS', 512, 424);\n      for (let i = 0; i < 8; i++) {\n        const cx = 190 + i * 92, cy = 490;\n        ctx.strokeStyle = HEX.amber; ctx.lineWidth = 2;\n        ctx.beginPath(); ctx.arc(cx, cy, 28, 0, Math.PI * 2); ctx.stroke();\n        ctx.fillStyle = HEX.warmWhite; ctx.font = '500 20px ' + FONTS.sans;\n        ctx.fillText(String(i + 1), cx, cy + 1);\n      }\n      break;\n    }\n  }\n}\n\n/* --- Signage --- */\nfunction createSignCanvas(text) {\n  const c = makeCanvas(512, 128);\n  const ctx = c.getContext('2d');\n  ctx.fillStyle = '#0a0a0f'; ctx.fillRect(0, 0, 512, 128);\n  ctx.fillStyle = HEX.warmWhite;\n  ctx.font = 'bold 62px ' + FONTS.serif;\n  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n  ctx.letterSpacing = '10px';\n  ctx.fillText(text, 256, 68);\n  return c;\n}\n\n/* --- Agent room screens (Act 5) --- */\nfunction screenFrame(ctx, title) {\n  ctx.fillStyle = HEX.bg; ctx.fillRect(0, 0, 1024, 640);\n  ctx.strokeStyle = 'rgba(232,128,74,0.7)'; ctx.lineWidth = 3;\n  ctx.strokeRect(16, 16, 992, 608);\n  ctx.fillStyle = HEX.amberBright;\n  ctx.font = '400 26px ' + FONTS.mono;\n  ctx.textAlign = 'left'; ctx.textBaseline = 'top';\n  ctx.letterSpacing = '6px';\n  ctx.fillText(title, 52, 52);\n  ctx.letterSpacing = '0px';\n  ctx.strokeStyle = 'rgba(232,128,74,0.35)'; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.moveTo(52, 104); ctx.lineTo(972, 104); ctx.stroke();\n}\n\nfunction createScreenCanvas(i) {\n  const c = makeCanvas(1024, 640);\n  const ctx = c.getContext('2d');\n\n  if (i === 0) {\n    screenFrame(ctx, 'DISCOVER · E5 FRAMEWORK');\n    const rows = [\n      ['EXPAND',    '12-day TAT is symptom, not problem'],\n      ['EXAMINE',   'Legacy LOS · manual reconciliation · branch variance'],\n      ['EMPATHIZE', 'RM burden · credit approver bottleneck'],\n      ['ELEVATE',   'Ownership sits with IT, needs business joint ownership'],\n      ['ENVISION',  'Control layer around core, not through it']\n    ];\n    rows.forEach((r, k) => {\n      const y = 150 + k * 92;\n      ctx.strokeStyle = 'rgba(232,128,74,0.45)'; ctx.lineWidth = 1;\n      ctx.strokeRect(52, y, 920, 76);\n      ctx.fillStyle = 'rgba(232,128,74,0.14)'; ctx.fillRect(52, y, 250, 76);\n      ctx.fillStyle = HEX.amberBright; ctx.font = '500 24px ' + FONTS.sans;\n      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';\n      ctx.fillText(r[0], 76, y + 38);\n      ctx.fillStyle = HEX.warmWhite; ctx.font = '400 21px ' + FONTS.sans;\n      ctx.fillText(r[1], 326, y + 38);\n    });\n  }\n\n  if (i === 1) {\n    screenFrame(ctx, 'DIAGNOSE · McKINSEY 7S');\n    const nodes = [\n      ['STRATEGY', true], ['STRUCTURE', true], ['SYSTEMS', false], ['SKILLS', true],\n      ['STYLE', false], ['STAFF', false], ['SHARED VALUES', true]\n    ];\n    const cx = 512, cy = 390, orbitR = 190, nodeR = 62;\n    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n    nodes.forEach((_, k) => {\n      const a = (k / 7) * Math.PI * 2 - Math.PI / 2;\n      ctx.strokeStyle = 'rgba(232,128,74,0.35)'; ctx.lineWidth = 1;\n      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * orbitR, cy + Math.sin(a) * orbitR); ctx.stroke();\n    });\n    nodes.forEach((n, k) => {\n      const a = (k / 7) * Math.PI * 2 - Math.PI / 2;\n      const nx = cx + Math.cos(a) * orbitR, ny = cy + Math.sin(a) * orbitR;\n      ctx.fillStyle = HEX.bg;\n      ctx.beginPath(); ctx.arc(nx, ny, nodeR, 0, Math.PI * 2); ctx.fill();\n      ctx.strokeStyle = n[1] ? HEX.teal : HEX.amberBright; ctx.lineWidth = 2; ctx.stroke();\n      ctx.fillStyle = HEX.warmWhite; ctx.font = '400 15px ' + FONTS.sans;\n      wrapText(ctx, n[0], nx, ny - 6, 104, 17);\n      ctx.fillStyle = n[1] ? HEX.teal : HEX.amberBright;\n      ctx.beginPath(); ctx.arc(nx, ny + 34, 6, 0, Math.PI * 2); ctx.fill();\n    });\n    ctx.fillStyle = 'rgba(232,128,74,0.9)';\n    ctx.beginPath(); ctx.arc(cx, cy, 52, 0, Math.PI * 2); ctx.fill();\n    ctx.fillStyle = HEX.bg; ctx.font = 'bold 34px ' + FONTS.serif;\n    ctx.fillText('7S', cx, cy + 1);\n    ctx.textAlign = 'left'; ctx.font = '400 17px ' + FONTS.mono;\n    ctx.fillStyle = HEX.teal;    ctx.fillText('● ALIGNED  4', 60, 596);\n    ctx.fillStyle = HEX.amberBright; ctx.fillText('● MISALIGNED  3', 240, 596);\n  }\n\n  if (i === 2) {\n    screenFrame(ctx, 'DEFINE · REQUIREMENTS');\n    const heads = ['BR ID', 'UR ID', 'FR ID', 'CAPABILITY'];\n    const xs = [72, 232, 392, 560];\n    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';\n    ctx.fillStyle = HEX.teal; ctx.font = '400 19px ' + FONTS.mono;\n    heads.forEach((h, k) => ctx.fillText(h, xs[k], 156));\n    ctx.strokeStyle = 'rgba(232,128,74,0.4)'; ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.moveTo(52, 184); ctx.lineTo(972, 184); ctx.stroke();\n    const rows = [\n      ['BR-01','UR-04','FR-01','Single loan case record'],\n      ['BR-02','UR-07','FR-02','Central credit rules'],\n      ['BR-03','UR-09','FR-06','API partner exchange'],\n      ['BR-04','UR-11','FR-07','Audit event capture']\n    ];\n    rows.forEach((r, k) => {\n      const y = 232 + k * 80;\n      ctx.fillStyle = k % 2 ? 'rgba(232,128,74,0.05)' : 'transparent';\n      ctx.fillRect(52, y - 28, 920, 62);\n      ctx.font = '400 22px ' + FONTS.mono;\n      ctx.fillStyle = HEX.amberBright;\n      ctx.fillText(r[0], xs[0], y); ctx.fillText(r[1], xs[1], y); ctx.fillText(r[2], xs[2], y);\n      ctx.fillStyle = HEX.warmWhite; ctx.font = '400 22px ' + FONTS.sans;\n      ctx.fillText(r[3], xs[3], y);\n      ctx.strokeStyle = 'rgba(232,128,74,0.18)';\n      ctx.beginPath(); ctx.moveTo(52, y + 34); ctx.lineTo(972, y + 34); ctx.stroke();\n    });\n    ctx.fillStyle = HEX.teal; ctx.font = '400 17px ' + FONTS.mono;\n    ctx.fillText('4 OF 11 TRACED · FULL MATRIX IN APPENDIX', 72, 592);\n  }\n\n  if (i === 3) {\n    screenFrame(ctx, 'DESIGN · ZACHMAN');\n    const cols = ['WHAT','HOW','WHERE','WHO','WHEN','WHY'];\n    const rows = ['STRAT','EXEC','ARCH','ENGR','TECH','WORK'];\n    const cell = 66, gx = 330, gy = 190;\n    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\n    ctx.fillStyle = HEX.teal; ctx.font = '400 17px ' + FONTS.mono;\n    cols.forEach((c, k) => ctx.fillText(c, gx + k * cell + cell / 2, gy - 22));\n    ctx.textAlign = 'right';\n    rows.forEach((r, k) => ctx.fillText(r, gx - 18, gy + k * cell + cell / 2));\n    const filled = [0,1,3,6,7,10,12,13,15,18,19,22,24,27,31];\n    for (let r = 0; r < 6; r++) for (let c = 0; c < 6; c++) {\n      const x = gx + c * cell, y = gy + r * cell, idx = r * 6 + c;\n      if (filled.indexOf(idx) !== -1) { ctx.fillStyle = 'rgba(232,128,74,0.8)'; ctx.fillRect(x + 3, y + 3, cell - 6, cell - 6); }\n      ctx.strokeStyle = 'rgba(232,128,74,0.55)'; ctx.lineWidth = 1;\n      ctx.strokeRect(x, y, cell, cell);\n    }\n    ctx.textAlign = 'left'; ctx.fillStyle = HEX.teal; ctx.font = '400 17px ' + FONTS.mono;\n    ctx.fillText('15 / 36 CELLS POPULATED', 72, 592);\n  }\n\n  if (i === 4) {\n    screenFrame(ctx, 'DELIVER · ADKAR + ROADMAP');\n    const groups = [\n      ['RM',     [90, 70, 60, 50, 40]],\n      ['CREDIT', [80, 60, 70, 70, 60]]\n    ];\n    const keys = ['A','D','K','A','R'];\n    ctx.textBaseline = 'middle';\n    groups.forEach((g, gi) => {\n      const y = 156 + gi * 118;\n      ctx.textAlign = 'left'; ctx.fillStyle = HEX.teal; ctx.font = '400 20px ' + FONTS.mono;\n      ctx.fillText(g[0], 60, y + 40);\n      g[1].forEach((v, k) => {\n        const x = 180 + k * 160;\n        ctx.strokeStyle = 'rgba(232,128,74,0.5)'; ctx.lineWidth = 1;\n        ctx.strokeRect(x, y, 140, 80);\n        ctx.fillStyle = 'rgba(232,128,74,0.7)';\n        ctx.fillRect(x, y + 80 - (80 * v / 100), 140, 80 * v / 100);\n        ctx.textAlign = 'center';\n        ctx.fillStyle = HEX.warmWhite; ctx.font = '500 22px ' + FONTS.sans;\n        ctx.fillText(keys[k] + ' ' + v, x + 70, y + 40);\n      });\n    });\n    ctx.strokeStyle = 'rgba(232,128,74,0.35)'; ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.moveTo(52, 420); ctx.lineTo(972, 420); ctx.stroke();\n    const stages = ['M1 DIAGNOSE','M2–3 MVP','M4 PILOT','M5–9 SCALE','M10–12 STABILISE'];\n    const ty = 508;\n    ctx.strokeStyle = 'rgba(232,128,74,0.6)'; ctx.lineWidth = 2;\n    ctx.beginPath(); ctx.moveTo(78, ty); ctx.lineTo(946, ty); ctx.stroke();\n    stages.forEach((s, k) => {\n      const x = 78 + k * 217;\n      ctx.fillStyle = HEX.amberBright;\n      ctx.beginPath(); ctx.arc(x, ty, 9, 0, Math.PI * 2); ctx.fill();\n      ctx.textAlign = k === stages.length - 1 ? 'right' : 'left';\n      ctx.fillStyle = HEX.warmWhite; ctx.font = '400 18px ' + FONTS.mono;\n      ctx.fillText(s, k === stages.length - 1 ? x + 8 : x - 4, ty + 42);\n    });\n  }\n\n  return c;\n}\n\n/* ===================================================================\n   GEOMETRY BUILDERS\n   =================================================================== */\n\nfunction createSky() {\n  const skyVertex = `\n    varying vec3 vWorldPosition;\n    void main() {\n      vec4 worldPosition = modelMatrix * vec4(position, 1.0);\n      vWorldPosition = worldPosition.xyz;\n      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);\n    }`;\n  const skyFragment = `\n    uniform vec3 topColor;\n    uniform vec3 horizonColor;\n    uniform vec3 bottomColor;\n    varying vec3 vWorldPosition;\n    void main() {\n      float h = normalize(vWorldPosition).y;\n      vec3 color;\n      if (h > 0.0) { color = mix(horizonColor, topColor, pow(h, 0.6)); }\n      else { color = mix(horizonColor, bottomColor, pow(-h, 0.5)); }\n      gl_FragColor = vec4(color, 1.0);\n    }`;\n  const skyMat = new THREE.ShaderMaterial({\n    uniforms: {\n      topColor: { value: new THREE.Color(COLORS.purpleDeep) },\n      horizonColor: { value: new THREE.Color(0x8b4a3f) },\n      bottomColor: { value: new THREE.Color(0x050508) }\n    },\n    vertexShader: skyVertex,\n    fragmentShader: skyFragment,\n    side: THREE.BackSide,\n    depthWrite: false,\n    fog: false\n  });\n  return new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), skyMat);\n}\n\n// shared window materials — one instance each keeps the draw-call/material count low\nconst windowMat = new THREE.MeshBasicMaterial({ color: COLORS.windowLit, transparent: true, opacity: 0.9, fog: false });\nconst dimWindowMat = new THREE.MeshBasicMaterial({ color: 0x2a1f18, transparent: true, opacity: 0.6 });\nconst windowGeom = new THREE.PlaneGeometry(0.6, 0.9);\n\nfunction createBuilding(w, h, d, isHero) {\n  const group = new THREE.Group();\n\n  const body = new THREE.Mesh(\n    new THREE.BoxGeometry(w, h, d),\n    new THREE.MeshStandardMaterial({\n      color: isHero ? COLORS.structureMid : COLORS.structureDark,\n      roughness: 0.7, metalness: 0.3\n    })\n  );\n  body.castShadow = true; body.receiveShadow = true;\n  group.add(body);\n\n  const floors = Math.floor(h / 2.5);\n  const windowsPerFloor = Math.max(2, Math.floor(w / 1.5));\n\n  for (let f = 1; f < floors; f++) {\n    for (let wi = 0; wi < windowsPerFloor; wi++) {\n      const lit = Math.random() < 0.4;\n      const wm = lit ? windowMat : dimWindowMat;\n      const wMesh = new THREE.Mesh(windowGeom, wm);\n      const xOffset = -w/2 + (wi + 0.5) * (w / windowsPerFloor);\n      wMesh.position.set(xOffset, -h/2 + f * 2.5, d/2 + 0.02);\n      group.add(wMesh);\n\n      if (Math.random() < 0.7) {\n        const wMesh2 = new THREE.Mesh(windowGeom, wm);\n        wMesh2.position.set(xOffset, wMesh.position.y, -d/2 - 0.02);\n        wMesh2.rotation.y = Math.PI;\n        group.add(wMesh2);\n      }\n    }\n  }\n  return group;\n}\n\nfunction generateCity() {\n  const cityGroup = new THREE.Group();\n  for (let i = 0; i < 18; i++) {\n    let x, z, guard = 0;\n    do {\n      x = (Math.random() - 0.5) * 180;\n      z = -80 + Math.random() * 60;\n      guard++;\n    } while (Math.abs(x) < 20 && z > -50 && guard < 40);\n\n    const width = 6 + Math.random() * 10;\n    const depth = 6 + Math.random() * 10;\n    const height = 15 + Math.random() * 35;\n\n    const building = createBuilding(width, height, depth, false);\n    building.position.set(x, height / 2, z);\n    cityGroup.add(building);\n  }\n  return cityGroup;\n}\n\nfunction createHeroBuilding() {\n  const group = new THREE.Group();\n  const W = 18, D = 18, H = 55;\n\n  const tower = createBuilding(W, H, D, true);\n  tower.position.set(0, H / 2, 0);\n  group.add(tower);\n\n  const plinth = new THREE.Mesh(\n    new THREE.BoxGeometry(22, 3, 22),\n    new THREE.MeshStandardMaterial({ color: COLORS.structureMid, roughness: 0.8, metalness: 0.2 })\n  );\n  plinth.position.set(0, 1.5, 0);\n  plinth.castShadow = true; plinth.receiveShadow = true;\n  group.add(plinth);\n\n  // floor grooves imply storeys without adding window geometry\n  const grooveMat = new THREE.MeshStandardMaterial({ color: 0x101016, roughness: 0.9 });\n  for (let y = 5; y < H; y += 5) {\n    const g = new THREE.Mesh(new THREE.BoxGeometry(W + 0.2, 0.15, D + 0.2), grooveMat);\n    g.position.set(0, y, 0);\n    group.add(g);\n  }\n\n  const glass = new THREE.Mesh(\n    new THREE.BoxGeometry(6, 5, 0.3),\n    new THREE.MeshPhysicalMaterial({\n      color: 0x1a2838, metalness: 0.9, roughness: 0.1,\n      transmission: 0.4, transparent: true, opacity: 0.7\n    })\n  );\n  glass.position.set(0, 4, 8.1);   // building sits at z=-30, so local +z faces camera\n  group.add(glass);\n\n  const signTex = new THREE.CanvasTexture(createSignCanvas('AVANTIA'));\n  signTex.encoding = THREE.sRGBEncoding;\n  const sign = new THREE.Mesh(\n    new THREE.PlaneGeometry(8, 2),\n    new THREE.MeshBasicMaterial({ map: signTex, transparent: false, fog: false })\n  );\n  sign.position.set(0, 48, 9.2);\n  group.add(sign);\n\n  group.position.set(0, 0, -30);\n  return group;\n}\n\nfunction createDoors() {\n  const doorMat = new THREE.MeshStandardMaterial({\n    color: 0x14141c, roughness: 0.25, metalness: 0.8\n  });\n  const geom = new THREE.BoxGeometry(1.4, 4, 0.15);\n  const l = new THREE.Mesh(geom, doorMat);\n  l.position.set(-0.7, 2, -21.75);\n  const r = new THREE.Mesh(geom, doorMat);\n  r.position.set(0.7, 2, -21.75);\n  l.castShadow = r.castShadow = true;\n  return { l, r };\n}\n\nconst CORRIDOR = { zStart: -22, length: 45, width: 8, height: 6 };\n\nfunction createCorridor() {\n  const group = new THREE.Group();\n  const { zStart, length, width, height } = CORRIDOR;\n  const midZ = zStart - length / 2;\n\n  const floor = new THREE.Mesh(\n    new THREE.PlaneGeometry(width, length),\n    new THREE.MeshStandardMaterial({ color: 0x0f0f14, roughness: 0.3, metalness: 0.6 })\n  );\n  floor.rotation.x = -Math.PI / 2;\n  floor.position.set(0, 0, midZ);\n  floor.receiveShadow = true;\n  group.add(floor);\n\n  const ceiling = new THREE.Mesh(\n    new THREE.PlaneGeometry(width, length),\n    new THREE.MeshStandardMaterial({ color: COLORS.structureDark, roughness: 0.9 })\n  );\n  ceiling.rotation.x = Math.PI / 2;\n  ceiling.position.set(0, height, midZ);\n  group.add(ceiling);\n\n  const wallMat = new THREE.MeshStandardMaterial({ color: COLORS.structureDark, roughness: 0.85 });\n  const wallGeom = new THREE.PlaneGeometry(length, height);\n  const wallL = new THREE.Mesh(wallGeom, wallMat);\n  wallL.rotation.y = Math.PI / 2;\n  wallL.position.set(-width / 2, height / 2, midZ);\n  wallL.receiveShadow = true;\n  group.add(wallL);\n  const wallR = new THREE.Mesh(wallGeom, wallMat);\n  wallR.rotation.y = -Math.PI / 2;\n  wallR.position.set(width / 2, height / 2, midZ);\n  wallR.receiveShadow = true;\n  group.add(wallR);\n\n  const strip = new THREE.Mesh(\n    new THREE.PlaneGeometry(0.3, length - 2),\n    new THREE.MeshBasicMaterial({ color: COLORS.amber, fog: false })\n  );\n  strip.rotation.x = -Math.PI / 2;\n  strip.position.set(0, 0.02, midZ);\n  group.add(strip);\n\n  for (let i = 0; i < 8; i++) {\n    const zPos = zStart - 2 - i * (length - 4) / 7;\n    const fixture = new THREE.Mesh(\n      new THREE.SphereGeometry(0.15, 8, 8),\n      new THREE.MeshBasicMaterial({ color: COLORS.warmWhite, fog: false })\n    );\n    fixture.position.set(0, height - 0.1, zPos);\n    group.add(fixture);\n\n    const pt = new THREE.PointLight(COLORS.warmWhite, 0.6, 8);\n    pt.position.set(0, height - 0.3, zPos);\n    group.add(pt);\n  }\n\n  // corridor end archway\n  const arch = new THREE.Mesh(\n    new THREE.TorusGeometry(2.5, 0.15, 8, 24, Math.PI),\n    new THREE.MeshBasicMaterial({ color: COLORS.amberBright, fog: false })\n  );\n  arch.position.set(0, 1.2, -67);\n  group.add(arch);\n  const archGlow = new THREE.PointLight(COLORS.amberBright, 1.6, 18);\n  archGlow.position.set(0, 2.5, -69);\n  group.add(archGlow);\n\n  return group;\n}\n\nfunction createFrameworkPanels() {\n  const group = new THREE.Group();\n  const panels = [];\n  FRAMEWORK_PANELS.forEach((fw, i) => {\n    const texture = new THREE.CanvasTexture(createPanelCanvas(fw));\n    texture.encoding = THREE.sRGBEncoding;\n    texture.anisotropy = 8;\n\n    const mat = new THREE.MeshStandardMaterial({\n      map: texture,\n      emissive: new THREE.Color(COLORS.warmWhite),\n      emissiveMap: texture,\n      emissiveIntensity: 0.35,\n      roughness: 0.9,\n      transparent: true\n    });\n\n    const panel = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 2.0), mat);\n    const zPos = -27 - i * 5;\n    const onLeft = i % 2 === 0;\n    panel.position.set(onLeft ? -3.95 : 3.95, 2.5, zPos);\n    panel.rotation.y = onLeft ? Math.PI / 2 : -Math.PI / 2;\n\n    panel.userData.baseEmissive = 0.35;\n    panel.userData.frameworkName = fw.name;\n    panel.userData.subtitle = fw.subtitle;\n    panel.userData.triggerZ = zPos + 3;\n    panel.userData.pulsed = false;\n    panel.userData.pulseT = -1;\n\n    panels.push(panel);\n    group.add(panel);\n  });\n  return { group, panels };\n}\n\nfunction createAgentRoom() {\n  const group = new THREE.Group();\n  const radius = 14, height = 8, centerZ = ROOM_CENTER_Z;\n\n  const floorShape = new THREE.Shape();\n  for (let i = 0; i < 6; i++) {\n    const angle = (i / 6) * Math.PI * 2;\n    const x = Math.cos(angle) * radius, z = Math.sin(angle) * radius;\n    if (i === 0) floorShape.moveTo(x, z); else floorShape.lineTo(x, z);\n  }\n  floorShape.closePath();\n\n  const floor = new THREE.Mesh(\n    new THREE.ShapeGeometry(floorShape),\n    new THREE.MeshStandardMaterial({ color: 0x0f0f14, roughness: 0.25, metalness: 0.7, side: THREE.DoubleSide })\n  );\n  floor.rotation.x = -Math.PI / 2;\n  floor.position.set(0, 0, centerZ);\n  floor.receiveShadow = true;\n  group.add(floor);\n\n  const ceiling = new THREE.Mesh(\n    floor.geometry,\n    new THREE.MeshStandardMaterial({ color: COLORS.structureDark, roughness: 0.95, side: THREE.DoubleSide })\n  );\n  ceiling.rotation.x = Math.PI / 2;\n  ceiling.position.set(0, height, centerZ);\n  group.add(ceiling);\n\n  // wall index 1 (angle PI/2) faces the corridor and is left open as the entry\n  const wallMat = new THREE.MeshStandardMaterial({ color: COLORS.structureDark, roughness: 0.9, side: THREE.DoubleSide });\n  const apothem = radius * 0.866;\n  const wallW = 2 * radius * Math.sin(Math.PI / 6);\n  const wallSlots = [];\n\n  for (let i = 0; i < 6; i++) {\n    const angle = (i / 6) * Math.PI * 2 + Math.PI / 6;\n    const px = Math.cos(angle) * apothem;\n    const pz = centerZ + Math.sin(angle) * apothem;\n    if (i === 1) continue;   // entry side stays open\n    const wall = new THREE.Mesh(new THREE.PlaneGeometry(wallW, height), wallMat);\n    wall.position.set(px, height / 2, pz);\n    wall.lookAt(0, height / 2, centerZ);\n    wall.receiveShadow = true;\n    group.add(wall);\n    wallSlots.push({ angle, px, pz });\n  }\n\n  const plinth = new THREE.Mesh(\n    new THREE.CylinderGeometry(2.5, 3, 0.6, 24),\n    new THREE.MeshStandardMaterial({\n      color: COLORS.structureMid, roughness: 0.4, metalness: 0.6,\n      emissive: new THREE.Color(COLORS.amber), emissiveIntensity: 0.15\n    })\n  );\n  plinth.position.set(0, 0.3, centerZ);\n  plinth.castShadow = true; plinth.receiveShadow = true;\n  group.add(plinth);\n\n  // 5 wall screens, all initially dark\n  const screens = [];\n  wallSlots.forEach(slot => {\n    const screen = new THREE.Mesh(\n      new THREE.PlaneGeometry(4, 2.5),\n      new THREE.MeshBasicMaterial({ color: 0x0a0a0f })\n    );\n    const inset = 0.15;\n    screen.position.set(\n      Math.cos(slot.angle) * (apothem - inset),\n      3.4,\n      centerZ + Math.sin(slot.angle) * (apothem - inset)\n    );\n    screen.lookAt(0, 3.4, centerZ);\n    screen.userData.active = false;\n    screens.push(screen);\n    group.add(screen);\n  });\n\n  return { group, centerZ, radius, height, screens };\n}\n\nfunction createAgentForm(centerZ) {\n  const group = new THREE.Group();\n\n  const core = new THREE.Mesh(\n    new THREE.IcosahedronGeometry(1.2, 0),\n    new THREE.MeshStandardMaterial({\n      color: COLORS.amber, emissive: new THREE.Color(COLORS.amber),\n      emissiveIntensity: 0.6, roughness: 0.3, metalness: 0.7\n    })\n  );\n  core.castShadow = true;\n  group.add(core);\n\n  const wire = new THREE.Mesh(\n    new THREE.IcosahedronGeometry(1.35, 1),\n    new THREE.MeshBasicMaterial({ color: COLORS.amberBright, wireframe: true, transparent: true, opacity: 0.6, fog: false })\n  );\n  group.add(wire);\n\n  group.position.set(0, 2.2, centerZ);\n  group.userData.core = core;\n  group.userData.wire = wire;\n  group.userData.spinSpeed = 0.3;\n  group.userData.pulseSpeed = 1.0;\n  return group;\n}\n\nfunction createParticles(centerZ) {\n  const count = 200;\n  const positions = new Float32Array(count * 3);\n  for (let i = 0; i < count; i++) {\n    const r = 3 + Math.random() * 5;\n    const theta = Math.random() * Math.PI * 2;\n    const phi = Math.acos(2 * Math.random() - 1);\n    positions[i*3]     = r * Math.sin(phi) * Math.cos(theta);\n    positions[i*3 + 1] = 1 + Math.random() * 5;\n    positions[i*3 + 2] = centerZ + r * Math.sin(phi) * Math.sin(theta);\n  }\n  const geom = new THREE.BufferGeometry();\n  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));\n  const mat = new THREE.PointsMaterial({\n    color: COLORS.amber, size: 0.05, transparent: true,\n    opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false\n  });\n  const pts = new THREE.Points(geom, mat);\n  // rotate about the room centre, not the world origin\n  pts.position.z = centerZ;\n  pts.geometry.translate(0, 0, -centerZ);\n  return pts;\n}\n\n/* ===================================================================\n   CAMERA PATH\n   =================================================================== */\n\nconst CAMERA_KEYFRAMES = [\n  { t: 0.0,  pos: [0, 40, 120],  look: [0, 20, 0] },\n  { t: 3.0,  pos: [0, 40, 120],  look: [0, 20, 0] },\n  { t: 6.0,  pos: [0, 32, 80],   look: [0, 20, -10] },\n  { t: 9.0,  pos: [0, 20, 30],   look: [0, 15, -20] },\n  { t: 11.0, pos: [0, 8, 0],     look: [0, 5, -20] },\n  { t: 13.5, pos: [0, 4, -18],   look: [0, 3, -25] },\n  { t: 14.5, pos: [0, 3, -22],   look: [0, 3, -30] },\n  { t: 15.0, pos: [0, 3, -24],   look: [0, 3, -40] },\n  { t: 15.5, pos: [0, 3, -26],   look: [0, 3, -50] },\n  { t: 18.5, pos: [0, 3, -42],   look: [0, 3, -60] },\n  { t: 22.0, pos: [0, 3, -65],   look: [0, 3, -75] },\n  { t: 24.0, pos: [0, 4, -75],   look: [0, 2.5, -82] },\n  { t: 25.0, pos: [4, 4.5, -74], look: [0, 2.5, -82] }\n];\n\nfunction getCameraStateAtTime(time) {\n  const kfs = CAMERA_KEYFRAMES;\n  if (time <= kfs[0].t) return { pos: kfs[0].pos.slice(), look: kfs[0].look.slice() };\n  const last = kfs[kfs.length - 1];\n  if (time >= last.t) return { pos: last.pos.slice(), look: last.look.slice() };\n\n  for (let i = 0; i < kfs.length - 1; i++) {\n    const a = kfs[i], b = kfs[i + 1];\n    if (b.t <= a.t) continue;                       // guard against duplicate timestamps\n    if (time >= a.t && time <= b.t) {\n      const eased = easeInOutCubic((time - a.t) / (b.t - a.t));\n      return {\n        pos: [\n          a.pos[0] + (b.pos[0] - a.pos[0]) * eased,\n          a.pos[1] + (b.pos[1] - a.pos[1]) * eased,\n          a.pos[2] + (b.pos[2] - a.pos[2]) * eased\n        ],\n        look: [\n          a.look[0] + (b.look[0] - a.look[0]) * eased,\n          a.look[1] + (b.look[1] - a.look[1]) * eased,\n          a.look[2] + (b.look[2] - a.look[2]) * eased\n        ]\n      };\n    }\n  }\n  return { pos: last.pos.slice(), look: last.look.slice() };\n}\n\n/* ===================================================================\n   ACT EVENTS\n   =================================================================== */\n\nfunction openDoors() {\n  doorsOpened = true;\n  doorOpenStart = clock.getElapsedTime();\n}\n\nfunction updateDoors() {\n  if (doorOpenStart === null) return;\n  const p = Math.min(1, (clock.getElapsedTime() - doorOpenStart) / TIMING.act3_doorsOpen);\n  const e = easeInOutCubic(p);\n  doorL.position.x = -0.7 + (-2.2 + 0.7) * e;\n  doorR.position.x = 0.7 + (2.2 - 0.7) * e;\n  if (p >= 1) doorOpenStart = null;\n}\n\nfunction triggerEntryFlash() {\n  flashTriggered = true;\n  const el = document.getElementById('flash');\n  el.classList.remove('fire');\n  void el.offsetWidth;      // restart the animation\n  el.classList.add('fire');\n}\n\nfunction pulsePanel(panel) {\n  panel.userData.pulsed = true;\n  panel.userData.pulseT = clock.getElapsedTime();\n}\n\nfunction showCorridorLabel(name, subtitle) {\n  const el = document.getElementById('hud-corridor-label');\n  el.classList.remove('hidden');\n  el.querySelector('.label-name').textContent = name;\n  el.querySelector('.label-subtitle').textContent = subtitle;\n  el.classList.add('show');\n  clearTimeout(labelTimer);\n  labelTimer = setTimeout(() => el.classList.remove('show'), 1900);\n}\n\nfunction onIntroComplete() {\n  document.getElementById('skip-intro').classList.add('hidden');\n  document.getElementById('hud-corridor-label').classList.remove('show');\n  const main = document.getElementById('hud-main');\n  main.classList.remove('hidden');\n  requestAnimationFrame(() => main.classList.add('show'));\n}\n\nfunction skipToInteractive() {\n  state = 'INTERACTIVE';\n  if (!doorsOpened) { openDoors(); doorOpenStart = null; }\n  doorL.position.x = -2.2; doorR.position.x = 2.2;\n  frameworkPanels.forEach(p => { p.userData.pulsed = true; p.material.emissiveIntensity = p.userData.baseEmissive; });\n  const k = CAMERA_KEYFRAMES[CAMERA_KEYFRAMES.length - 1];\n  camera.position.set(k.pos[0], k.pos[1], k.pos[2]);\n  camera.lookAt(k.look[0], k.look[1], k.look[2]);\n  document.getElementById('hud-intro').classList.add('fade-out');\n  onIntroComplete();\n}\n\nfunction replayIntro() {\n  // full reset back to Act 1\n  state = 'INTRO';\n  agentRunning = false;\n  doorsOpened = false; flashTriggered = false; doorOpenStart = null;\n  doorL.position.x = -0.7; doorR.position.x = 0.7;\n  frameworkPanels.forEach(p => { p.userData.pulsed = false; p.material.emissiveIntensity = p.userData.baseEmissive; });\n\n  agentScreens.forEach(s => {\n    if (s.userData.active) {\n      s.material.dispose();\n      s.material = new THREE.MeshBasicMaterial({ color: 0x0a0a0f });\n      s.userData.active = false;\n    }\n  });\n  agentForm.userData.spinSpeed = 0.3;\n  agentForm.userData.pulseSpeed = 1.0;\n\n  document.getElementById('hud-summary').classList.remove('show');\n  const main = document.getElementById('hud-main');\n  main.classList.remove('show');\n  setTimeout(() => main.classList.add('hidden'), 500);\n  document.getElementById('modal-output').classList.add('hidden');\n  document.getElementById('skip-intro').classList.remove('hidden');\n  document.getElementById('run-agent').disabled = false;\n\n  const intro = document.getElementById('hud-intro');\n  intro.classList.remove('fade-out');\n  introFadeDone = false;\n  clock.start();\n}\n\n/* ===================================================================\n   MOCK AGENT LOGIC\n   =================================================================== */\n\nasync function runAgent() {\n  if (agentRunning) return;\n  agentRunning = true;\n\n  // TODO: replace with fetch('/api/agent/run', { method:'POST', body: JSON.stringify({ brief }) })\n  const brief = document.getElementById('brief-input').value;\n  void brief;\n\n  document.getElementById('run-agent').disabled = true;\n  document.getElementById('hud-summary').classList.remove('show');\n\n  agentForm.userData.spinSpeed = 1.2;\n  agentForm.userData.pulseSpeed = 3.0;\n\n  startCameraOrbit();\n\n  for (let i = 0; i < agentScreens.length; i++) {\n    await sleep(2500);\n    if (!agentRunning) return;    // replay cancelled the run\n    activateScreen(i);\n  }\n\n  await sleep(2000);\n  if (!agentRunning) return;\n  showSummaryHUD();\n\n  agentForm.userData.spinSpeed = 0.3;\n  agentForm.userData.pulseSpeed = 1.0;\n  document.getElementById('run-agent').disabled = false;\n  agentRunning = false;\n}\n\nfunction activateScreen(i) {\n  // TODO: replace canvas mock with server-rendered analysis payload for screen i\n  const texture = new THREE.CanvasTexture(createScreenCanvas(i));\n  texture.encoding = THREE.sRGBEncoding;\n  texture.anisotropy = 8;\n  const mesh = agentScreens[i];\n  mesh.material.dispose();\n  mesh.material = new THREE.MeshStandardMaterial({\n    map: texture,\n    emissive: new THREE.Color(COLORS.warmWhite),\n    emissiveMap: texture,\n    emissiveIntensity: 1.2,   // brief flash, settles to 0.4 in the render loop\n    roughness: 0.9\n  });\n  mesh.userData.active = true;\n  mesh.userData.settleFrom = clock.getElapsedTime();\n}\n\nfunction showSummaryHUD() {\n  document.getElementById('hud-summary').classList.add('show');\n}\n\nfunction startCameraOrbit() {\n  orbitStartTime = clock.getElapsedTime();\n  state = 'ORBIT';\n}\n\n/* ===================================================================\n   INIT\n   =================================================================== */\n\nasync function init() {\n  // canvas textures use webfonts — draw only once they've actually loaded\n  try {\n    await Promise.all([\n      document.fonts.load('bold 72px Fraunces'),\n      document.fonts.load('500 28px Inter'),\n      document.fonts.load('400 20px \"JetBrains Mono\"')\n    ]);\n    await document.fonts.ready;\n  } catch (e) { /* fall back to system fonts in canvas */ }\n\n  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });\n  renderer.setSize(window.innerWidth, window.innerHeight);\n  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));\n  renderer.shadowMap.enabled = true;\n  renderer.shadowMap.type = THREE.PCFSoftShadowMap;\n  renderer.toneMapping = THREE.ACESFilmicToneMapping;\n  renderer.toneMappingExposure = 1.0;\n  renderer.outputEncoding = THREE.sRGBEncoding;\n  document.getElementById('canvas-container').appendChild(renderer.domElement);\n\n  scene = new THREE.Scene();\n  scene.background = new THREE.Color(COLORS.bgDeep);\n  scene.fog = new THREE.Fog(COLORS.bgDeep, 30, 200);\n\n  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);\n  camera.position.set(0, 40, 120);\n  camera.lookAt(0, 20, 0);\n\n  scene.add(createSky());\n\n  const ground = new THREE.Mesh(\n    new THREE.PlaneGeometry(400, 400),\n    new THREE.MeshStandardMaterial({ color: 0x151519, roughness: 0.9, metalness: 0.1 })\n  );\n  ground.rotation.x = -Math.PI / 2;\n  ground.receiveShadow = true;\n  scene.add(ground);\n\n  const grid = new THREE.GridHelper(400, 80, 0x1a1a22, 0x1a1a22);\n  grid.material.transparent = true;\n  grid.material.opacity = 0.15;\n  grid.position.y = 0.01;\n  scene.add(grid);\n\n  scene.add(generateCity());\n  scene.add(createHeroBuilding());\n\n  const doors = createDoors();\n  doorL = doors.l; doorR = doors.r;\n  scene.add(doorL, doorR);\n\n  scene.add(createCorridor());\n\n  const fp = createFrameworkPanels();\n  frameworkPanels = fp.panels;\n  scene.add(fp.group);\n\n  const room = createAgentRoom();\n  agentScreens = room.screens;\n  scene.add(room.group);\n\n  agentForm = createAgentForm(room.centerZ);\n  scene.add(agentForm);\n\n  particles = createParticles(room.centerZ);\n  scene.add(particles);\n\n  /* === LIGHTING === */\n  scene.add(new THREE.AmbientLight(0x1a1520, 0.4));\n\n  const moon = new THREE.DirectionalLight(0x6570a0, 0.5);\n  moon.position.set(50, 100, 50);\n  moon.castShadow = true;\n  moon.shadow.mapSize.width = 1024;\n  moon.shadow.mapSize.height = 1024;\n  moon.shadow.camera.left = -120; moon.shadow.camera.right = 120;\n  moon.shadow.camera.top = 120;   moon.shadow.camera.bottom = -120;\n  moon.shadow.camera.far = 320;\n  scene.add(moon);\n\n  [-1, 1].forEach(side => {\n    const up = new THREE.SpotLight(COLORS.amber, 2.0, 60, Math.PI / 6, 0.4, 1);\n    up.position.set(side * 8, 1, -20);\n    up.target.position.set(side * 6, 40, -30);\n    scene.add(up, up.target);\n  });\n\n  const roomSpot = new THREE.SpotLight(COLORS.amber, 1.5, 15, Math.PI / 5, 0.5, 1);\n  roomSpot.position.set(0, 7.5, ROOM_CENTER_Z);\n  roomSpot.target.position.set(0, 0, ROOM_CENTER_Z);\n  roomSpot.castShadow = true;\n  scene.add(roomSpot, roomSpot.target);\n\n  for (let i = 0; i < 3; i++) {\n    const angle = (i / 3) * Math.PI * 2;\n    const rim = new THREE.PointLight(COLORS.amber, 0.4, 8);\n    rim.position.set(Math.cos(angle) * 4, 1.5, ROOM_CENTER_Z + Math.sin(angle) * 4);\n    scene.add(rim);\n  }\n\n  /* === HUD WIRING === */\n  document.getElementById('skip-intro').addEventListener('click', skipToInteractive);\n  document.getElementById('run-agent').addEventListener('click', runAgent);\n  document.getElementById('replay').addEventListener('click', replayIntro);\n  document.getElementById('view-output').addEventListener('click', () =>\n    document.getElementById('modal-output').classList.remove('hidden'));\n  document.getElementById('modal-close').addEventListener('click', () =>\n    document.getElementById('modal-output').classList.add('hidden'));\n  document.getElementById('modal-output').addEventListener('click', e => {\n    if (e.target.id === 'modal-output') e.currentTarget.classList.add('hidden');\n  });\n  document.getElementById('brief-input').addEventListener('keydown', e => {\n    if (e.key === 'Enter') runAgent();\n  });\n  window.addEventListener('keydown', e => {\n    if (e.key === 'Escape') document.getElementById('modal-output').classList.add('hidden');\n  });\n\n  window.addEventListener('resize', () => {\n    camera.aspect = window.innerWidth / window.innerHeight;\n    camera.updateProjectionMatrix();\n    renderer.setSize(window.innerWidth, window.innerHeight);\n  });\n\n  document.getElementById('modal-output').classList.add('hidden');\n  document.getElementById('intro-loading').remove();\n  document.body.classList.add('ready');\n\n  clock = new THREE.Clock();\n  animate();\n}\n\n/* ===================================================================\n   RENDER LOOP\n   =================================================================== */\n\nfunction animate() {\n  requestAnimationFrame(animate);\n  const delta = Math.min(clock.getDelta(), 0.1);\n  const t = clock.getElapsedTime();\n\n  if (state === 'INTRO') {\n    const cam = getCameraStateAtTime(t);\n    camera.position.set(cam.pos[0], cam.pos[1], cam.pos[2]);\n    camera.lookAt(cam.look[0], cam.look[1], cam.look[2]);\n\n    if (t >= TIMING.act1_total && !introFadeDone) {\n      introFadeDone = true;\n      document.getElementById('hud-intro').classList.add('fade-out');\n    }\n    if (t >= 14.0 && !doorsOpened) openDoors();\n    if (t >= 14.9 && !flashTriggered) triggerEntryFlash();\n\n    frameworkPanels.forEach(p => {\n      if (camera.position.z < p.userData.triggerZ && !p.userData.pulsed) {\n        pulsePanel(p);\n        showCorridorLabel(p.userData.frameworkName, p.userData.subtitle);\n      }\n    });\n\n    if (t >= TIMING.intro_total) {\n      state = 'INTERACTIVE';\n      onIntroComplete();\n    }\n  }\n\n  if (state === 'ORBIT') {\n    const elapsed = t - orbitStartTime;\n    const orbitDuration = 15;\n    const angle = (elapsed / orbitDuration) * Math.PI * 2;\n    camera.position.set(Math.cos(angle) * 6, 4.5, ROOM_CENTER_Z + Math.sin(angle) * 6);\n    camera.lookAt(0, 2.5, ROOM_CENTER_Z);\n    if (elapsed > orbitDuration) state = 'INTERACTIVE';\n  }\n\n  updateDoors();\n\n  // panel pulse decay\n  frameworkPanels.forEach(p => {\n    if (p.userData.pulseT >= 0) {\n      const e = t - p.userData.pulseT;\n      const k = Math.max(0, 1 - e / 1.4);\n      p.material.emissiveIntensity = p.userData.baseEmissive + 0.85 * k * k;\n      if (k <= 0) p.userData.pulseT = -1;\n    }\n  });\n\n  // screen activation flash settles to steady glow\n  agentScreens.forEach(s => {\n    if (s.userData.settleFrom !== undefined && s.material.emissiveIntensity !== undefined) {\n      const e = t - s.userData.settleFrom;\n      if (e < 0.9) s.material.emissiveIntensity = 1.2 - 0.8 * (e / 0.9);\n      else { s.material.emissiveIntensity = 0.4; delete s.userData.settleFrom; }\n    }\n  });\n\n  if (agentForm) {\n    agentForm.rotation.y += agentForm.userData.spinSpeed * delta;\n    agentForm.rotation.x += agentForm.userData.spinSpeed * 0.4 * delta;\n    const s = 1 + Math.sin(t * agentForm.userData.pulseSpeed) * 0.08;\n    agentForm.userData.core.scale.setScalar(s);\n    agentForm.userData.wire.rotation.y -= agentForm.userData.spinSpeed * 0.6 * delta;\n  }\n\n  if (particles) particles.rotation.y += 0.05 * delta;\n\n  renderer.render(scene, camera);\n}\n\ninit();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
    </script>
